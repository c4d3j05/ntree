name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # macOS runs the system bash 3.2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq netcat-openbsd lsof zsh
      - name: Configure git
        run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: make test
      - run: zsh -n completions/_ntree
